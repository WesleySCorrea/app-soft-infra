services:
  postgres-vendas:
    image: postgres:16
    environment:
      POSTGRES_DB: ${VENDAS_DB_NAME}
      POSTGRES_USER: ${VENDAS_DB_USER}
      POSTGRES_PASSWORD: ${VENDAS_DB_PASSWORD}
    ports:
      - "${VENDAS_DB_PORT}:5432"
    volumes:
      - postgres-vendas:/var/lib/postgresql/data

  postgres-produtos:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PRODUTOS_DB_NAME}
      POSTGRES_USER: ${PRODUTOS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUTOS_DB_PASSWORD}
    ports:
      - "${PRODUTOS_DB_PORT}:5432"
    volumes:
      - postgres-produtos:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/data:/opt/keycloak/data/h2

volumes:
  postgres-vendas:
  postgres-produtos:
